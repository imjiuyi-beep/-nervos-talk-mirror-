name: fetch_macro
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch macro (FRED)
        run: python3 scripts/fetch_macro.py
      - name: Commit
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/macro.json
          git diff --cached --quiet || git commit -m "update macro $(date -u +%F)"
          git push
