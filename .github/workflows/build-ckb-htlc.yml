name: build-ckb-htlc
on:
  workflow_dispatch:
  push:
    paths:
      - 'ckb-htlc/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85 + riscv64 target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add riscv64imac-unknown-none-elf --toolchain 1.85.0
      - name: Build contract
        working-directory: ckb-htlc
        run: |
          cargo +1.85.0 build --release
          cp target/riscv64imac-unknown-none-elf/release/ckb-htlc ckb-htlc.so
          echo "--- file ---"; file ckb-htlc.so
          echo "--- segments ---"; readelf -lW ckb-htlc.so | grep LOAD
          echo "--- sha256 ---"; sha256sum ckb-htlc.so
      - uses: actions/upload-artifact@v4
        with:
          name: ckb-htlc-so
          path: ckb-htlc/ckb-htlc.so
