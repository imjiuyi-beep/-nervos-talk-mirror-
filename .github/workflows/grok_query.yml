name: Grok Query (xai)
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'query about an X account/topic'
        required: true

permissions:
  contents: write

jobs:
  grok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Grok
        shell: bash
        run: |
          mkdir -p data
          export GXAI_KEY="$(cat scripts/gxai_key.txt 2>/dev/null || true)"
          if [ -n "$GXAI_KEY" ]; then echo "using key: ${GXAI_KEY:0:8}..."; else echo "NO KEY FOUND"; fi
          python3 scripts/grok_query.py "${{ inputs.query }}" > data/grok_last.txt 2>&1
          echo '--- result ---'
          cat data/grok_last.txt || true
      - name: Commit
        run: |
          git config user.name "relay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ scripts/gxai_key.txt || true
          git commit -m "grok query run" || echo "nothing to commit"
          git push
