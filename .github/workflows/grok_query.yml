name: Grok Query (xai)
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'query about an X account/topic'
        required: true

permissions:
  contents: write

jobs:
  grok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Grok
        shell: bash
        run: |
          pwd
          echo '--- diagnostic ---'
          ls -la scripts/ 2>&1 | head
          echo '--- key file check ---'
          if [ -f scripts/gxai_key.txt ]; then echo "FILE EXISTS size=$(wc -c < scripts/gxai_key.txt)"; head -c 10 scripts/gxai_key.txt; echo; else echo "FILE MISSING"; fi
          echo '--- git log ---'
          git log --oneline -3 2>&1
          mkdir -p data
          export GXAI_KEY="$(cat scripts/gxai_key.txt 2>/dev/null || true)"
          if [ -n "$GXAI_KEY" ]; then echo "using key: ${GXAI_KEY:0:8}..."; else echo "NO KEY FOUND"; fi
          python3 scripts/grok_query.py "${{ inputs.query }}" 2>&1 | tee data/grok_last.txt
