name: Daily Metrics
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-metrics
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: python3 scripts/daily_metrics.py
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add data/metrics.json
          git commit -m "metrics $(date -u +%Y%m%d%H%M)" || echo none
          git push
