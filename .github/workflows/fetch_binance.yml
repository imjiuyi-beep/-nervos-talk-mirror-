name: Fetch Binance Prices
on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分钟
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run fetch binance
        run: |
          chmod +x scripts/fetch_binance.sh
          bash scripts/fetch_binance.sh
      - name: Commit and push
        run: |
          git config user.name "binance-mirror[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "binance prices update $(date -u +%Y%m%d%H%M)"
            git push
          else
            echo "no changes"
          fi
