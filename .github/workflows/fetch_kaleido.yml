name: Fetch KaleidoSwap
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: pip install -q playwright && playwright install chromium --with-deps
      - name: Run fetch
        run: python3 scripts/fetch_kaleido.py
      - name: Commit
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kaleido_page.html data/kaleido_text.txt
          git commit -m "kaleidoswap browser snapshot" || echo "no change"
          git push
