name: Fetch Page (relay)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch'
        required: true
        default: 'https://www.google.com'
      name:
        description: 'Output file base name'
        required: false
        default: 'page'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: pip install -q playwright && playwright install chromium --with-deps
      - name: Run fetch
        run: python3 scripts/fetch_page.py
        env:
          FETCH_URL: ${{ inputs.url }}
          FETCH_NAME: ${{ inputs.name }}
      - name: Commit
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "relay fetch: ${{ inputs.name }}" || echo "no change"
          git push
