name: Fetch Talk
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-talk
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch talk.nervos.org
        run: bash scripts/fetch.sh
      - name: Commit and push
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "mirror update $(date -u +%Y%m%d%H%M)"
            git push
          fi
