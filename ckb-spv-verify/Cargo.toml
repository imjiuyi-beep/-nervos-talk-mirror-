[package]
name = "ckb-spv-verify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ckb-spv-verify"
path = "src/main.rs"

[dependencies]
ckb-std = { version = "0.15", default-features = false, features = ["allocator", "calc-hash", "ckb-types", "dummy-atomic"] }
ckb-bitcoin-spv-verifier = { path = "../ckb-bitcoin-spv/verifier", default-features = false, features = ["no-std"] }
secp256k1 = { version = "0.29", default-features = false }

[profile.release]
overflow-checks = true
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
core2 = { path = "../core2" }
